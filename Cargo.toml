[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/cli",
    "crates/napi",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/jaredhoward/better-test-automation"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "2"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# WebSocket (for WebDriver BiDi)
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
futures-util = "0.3"

# CLI
clap = { version = "4", features = ["derive"] }

# TUI
ratatui = "0.29"
crossterm = "0.28"

# NAPI
napi = { version = "2", features = ["async", "serde-json"] }
napi-derive = "2"

# Testing
pretty_assertions = "1"
