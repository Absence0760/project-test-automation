name: Release

# Publishes the CLI binaries and the npm packages for a published GitHub
# release.
#
# Everything is gated behind the `verify` job below. Without it, a release cut
# from any branch — or from a commit whose CI never passed — would publish to
# npm, and `pnpm publish --no-git-checks` (needed because CI checks out a
# detached HEAD) explicitly disables pnpm's own equivalent guard.

on:
  release:
    types: [published]

# Read-only baseline; each job requests only what it actually needs.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------
  # Release gate. Nothing publishes unless the released commit is on main
  # and its CI gate was green.
  # ---------------------------------------------------------------------
  verify:
    name: Verify release commit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history — `--contains` needs the commits between the tag and
          # the tip of main to decide ancestry.
          fetch-depth: 0

      - name: Require the released commit to be on main
        run: |
          set -euo pipefail
          # Explicit refspec: `git fetch origin main` alone updates FETCH_HEAD
          # and is not guaranteed to create refs/remotes/origin/main, which is
          # what --is-ancestor resolves below.
          git fetch --quiet origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Release commit $GITHUB_SHA is not an ancestor of origin/main."
            echo "Cut releases from main only — a tag on a feature branch must not publish."
            exit 1
          fi
          echo "Release commit is on main."

      - name: Require the CI gate to have passed on this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          conclusion=$(gh api \
            "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs" \
            --jq '[.check_runs[] | select(.name == "CI gate")] | .[0].conclusion // empty')
          if [ "$conclusion" != "success" ]; then
            echo "::error::CI gate on $GITHUB_SHA is '${conclusion:-missing}', expected 'success'."
            exit 1
          fi
          echo "CI gate is green on the release commit."

  build-cli:
    name: Build CLI — ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    needs: [verify]
    permissions:
      # Uploading the binary asset onto the release.
      contents: write
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: bettertest-linux-x64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: bettertest-linux-arm64
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: bettertest-darwin-x64
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: bettertest-darwin-arm64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: bettertest-windows-x64.exe

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        # Pinned to the tip of the action's `stable` branch. This freezes the
        # action code, not the Rust version — rustup still resolves "stable"
        # to the current release at run time.
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable @ 2026-09-03
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (Linux ARM)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Cache Cargo
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-release-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: cargo-release-${{ matrix.target }}-

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} -p bettertest-cli
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Rename binary (Unix)
        if: runner.os != 'Windows'
        run: cp target/${{ matrix.target }}/release/bettertest ${{ matrix.artifact }}

      - name: Rename binary (Windows)
        if: runner.os == 'Windows'
        run: cp target/${{ matrix.target }}/release/bettertest.exe ${{ matrix.artifact }}

      # Lets anyone downloading a binary straight from the release page verify
      # it, without which the download is unauthenticated. `shasum` is present
      # on all three runner images.
      - name: Generate checksum
        shell: bash
        run: shasum -a 256 "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256"

      - name: Upload binary to release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            ${{ matrix.artifact }}
            ${{ matrix.artifact }}.sha256

  publish-npm:
    name: Publish npm packages
    runs-on: ubuntu-latest
    needs: [verify, build-cli]
    permissions:
      contents: read
      # Required for npm provenance — the OIDC token is what lets npm attest
      # that these tarballs were built by this workflow from this commit.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        # No `version:` — pnpm/action-setup reads `packageManager` from
        # package.json. Specifying both is a hard error (ERR_PNPM_BAD_PM_VERSION).
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Run tests
        run: pnpm test

      - name: Publish packages
        # --no-git-checks is required because CI checks out a detached HEAD;
        # the `verify` job above is what actually enforces the branch/CI
        # guarantees pnpm's git checks would otherwise give us.
        run: pnpm -r publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Publishes a signed provenance attestation alongside each tarball,
          # linking it to this workflow run and commit. Consumers can verify
          # with `npm audit signatures`.
          NPM_CONFIG_PROVENANCE: true

  build-dashboard:
    name: Build Dashboard
    runs-on: ubuntu-latest
    needs: [verify]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        # No `version:` — pnpm/action-setup reads `packageManager` from
        # package.json. Specifying both is a hard error (ERR_PNPM_BAD_PM_VERSION).
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build dashboard
        run: pnpm --filter @bettertest/dashboard build

      - name: Upload dashboard artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dashboard-build
          path: apps/dashboard/build/
          retention-days: 30
